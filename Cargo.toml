[package]
name = "voxio"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
authors = ["Jaxx497"]
description = "A lightweight audio playback library"
license = "MIT"
repository = "https://github.com/Jaxx497/Voxio/"
keywords = ["music", "audio", "player" ]
categories = ["multimedia::audio"]
exclude = ["tests/"]

[dependencies]
cpal =  "0.18.1" 
crossbeam-channel = "0.5.15"
rtrb = "0.3.4"
rubato = "3.0.0"
symphonia = { version = "0.6.0", features = [ "aac", "aiff", "alac", "isomp4", "mp3" ] }
symphonia-adapter-libopus = { version = "0.3.0", optional = true }
thiserror = "2.0.18"

[features]
default = ["opus"]
opus = ["dep:symphonia-adapter-libopus"]
# Waveform extraction (`voxio::waveform`). Opt-in; adds no dependencies.
waveform = []

[dev-dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"

# Interactive voxio waveform viewer; needs the feature.
[[example]]
name = "draw_waveform"
required-features = ["waveform"]

[profile.dev.package."*"]
opt-level = 3
